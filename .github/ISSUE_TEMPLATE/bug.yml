name: Bug report
description: Report a reproducible defect
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Include the smallest reproducible steps.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Verification
      description: Paste output from npm run verify with secrets removed.
