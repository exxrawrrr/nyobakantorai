name: Feature proposal
description: Propose a bounded improvement to nyobakantorai
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    attributes:
      label: Problem
      description: What concrete problem should this solve?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful behavior and its trust boundary.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Safety and evidence
      description: What permissions, external writes, data sensitivity, or verification requirements are involved?
    validations:
      required: true
