name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate installer syntax
        shell: bash
        if: runner.os != 'Windows'
        run: bash -n install.sh
      - name: Validate installer syntax
        shell: powershell
        if: runner.os == 'Windows'
        run: '[scriptblock]::Create((Get-Content -Raw install.ps1)) | Out-Null'
      - run: npm run verify

  minimum-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: python -m pip install -r requirements-dev.txt
      - run: bash -n install.sh
      - run: npm run verify
