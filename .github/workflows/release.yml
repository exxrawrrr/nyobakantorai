name: release-gate

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "$expected" || {
            echo "release tag/package version mismatch: tag=$GITHUB_REF_NAME package=$expected" >&2
            exit 1
          }

      - name: Enforce v0.6.0 evidence readiness before publication
        if: github.ref == 'refs/tags/v0.6.0'
        run: npm run v0.6:readiness:require-ready

      - name: Enforce v0.6.1 reliability readiness before publication
        if: github.ref == 'refs/tags/v0.6.1'
        run: npm run v0.6.1:readiness:require-ready

      - run: npm run release:check

      - name: Verify and build reproducible employee packs
        run: |
          npm run employee:pack:check
          npm run employee:pack -- --employees=all --out=dist/employees
          mkdir -p dist/employee-zips

          fixed_time="1980-01-01 00:00:00 UTC"
          find dist/employees -type f -exec touch -d "$fixed_time" {} +

          for dir in dist/employees/*; do
            id="$(basename "$dir")"
            (
              cd "$dir"
              LC_ALL=C find . -type f -print0 | sort -z | xargs -0 zip -X -q "../../employee-zips/nyobakantorai-${id}.zip"
            )
          done

          (
            cd dist/employees
            LC_ALL=C find . -type f -print0 | sort -z | xargs -0 zip -X -q "../employee-zips/nyobakantorai-full-workforce.zip"
          )

          (
            cd dist/employee-zips
            LC_ALL=C sha256sum *.zip | sort > SHA256SUMS.txt
          )

      - name: Build immutable core install assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          package_version="$(node -p "require('./package.json').version")"
          mkdir -p dist/install-assets
          git archive --format=tar.gz --output="dist/install-assets/nyobakantorai-core-${tag}.tar.gz" "${GITHUB_SHA}"
          git archive --format=zip --output="dist/install-assets/nyobakantorai-core-${tag}.zip" "${GITHUB_SHA}"
          cp install.sh install.ps1 dist/install-assets/
          node scripts/build-install-assets.mjs \
            --dir dist/install-assets \
            --tag "${tag}" \
            --commit "${GITHUB_SHA}" \
            --package-version "${package_version}"

      - name: Verify immutable core install assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          node scripts/verify-install-assets.mjs \
            --dir dist/install-assets \
            --tag "${tag}" \
            --commit "${GITHUB_SHA}"
          tar -tzf "dist/install-assets/nyobakantorai-core-${tag}.tar.gz" >/dev/null
          unzip -tqq "dist/install-assets/nyobakantorai-core-${tag}.zip"
          mkdir -p dist/install-smoke/tar dist/install-smoke/zip
          tar -xzf "dist/install-assets/nyobakantorai-core-${tag}.tar.gz" -C dist/install-smoke/tar
          unzip -q "dist/install-assets/nyobakantorai-core-${tag}.zip" -d dist/install-smoke/zip
          test -f dist/install-smoke/tar/scripts/preflight.mjs
          test -f dist/install-smoke/tar/package.json
          test -f dist/install-smoke/zip/scripts/preflight.mjs
          test -f dist/install-smoke/zip/package.json

      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: nyobakantorai-install-assets
          path: |
            dist/install-assets/nyobakantorai-core-*.tar.gz
            dist/install-assets/nyobakantorai-core-*.zip
            dist/install-assets/install-manifest.json
            dist/install-assets/INSTALL-SHA256SUMS.txt
            dist/install-assets/install.sh
            dist/install-assets/install.ps1
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v7
        with:
          name: nyobakantorai-manifest
          path: release/manifest.json
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v7
        with:
          name: nyobakantorai-employee-packs
          path: |
            dist/employee-zips/*.zip
            dist/employee-zips/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  publish-tagged-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: release-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nyobakantorai-manifest
          path: dist/release-manifest

      - uses: actions/download-artifact@v8
        with:
          name: nyobakantorai-employee-packs
          path: dist/employee-zips

      - uses: actions/download-artifact@v8
        with:
          name: nyobakantorai-install-assets
          path: dist/install-assets

      - name: Publish employee packs and immutable install assets on tagged releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --generate-notes
          gh release upload "$tag" \
            dist/employee-zips/*.zip \
            dist/employee-zips/SHA256SUMS.txt \
            dist/release-manifest/manifest.json \
            dist/install-assets/nyobakantorai-core-*.tar.gz \
            dist/install-assets/nyobakantorai-core-*.zip \
            dist/install-assets/install-manifest.json \
            dist/install-assets/INSTALL-SHA256SUMS.txt \
            dist/install-assets/install.sh \
            dist/install-assets/install.ps1 \
            --clobber --repo "$GITHUB_REPOSITORY"
